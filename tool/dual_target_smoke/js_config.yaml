# Web (dart:js_interop) bindings for the dual-target fixture, generated by
# jsgen from the SAME header as ffi_config.yaml. The asset-id is the JS
# global the page publishes the Emscripten Module under (globalThis['dual']
# in main.mjs) and is baked into the generated initBindings default.
name: DualBindings
description: Web (dart:js_interop) bindings for the dual-target smoke fixture.
output: 'generated/dual_bindings_js.g.dart'
ffi-native:
  asset-id: dual
headers:
  entry-points:
    - 'native/include/dual.h'

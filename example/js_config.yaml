name: ExampleBindings
description: Bindings to `headers/example.h`.
output: 'lib/generated_bindings_js.g.dart'
# The JS global the page publishes the resolved Emscripten Module under
# (`globalThis['module']` in native/js/main.js). Baked into the generated
# `initBindings` as its default module name - the ffigen_js analog of
# ffigen's `ffi-native: asset-id:`.
ffi-native:
  asset-id: module
headers:
  entry-points:
    - 'native/include/example.h'
enums:
  as-int:
    include:
      - MyEnumAsInt

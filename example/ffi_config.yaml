name: NativeLibrary
description: Bindings to `headers/example.h`.
output: 'lib/generated_bindings_ffi.g.dart'
headers:
  entry-points:
    - 'native/include/example.h'
functions:
  leaf:
    include:
      - 'write_.*_for_address_test'
      - 'verify_typed_data_.*'
      - 'sum_bytes'
      - 'pointer_is_on_stack'
ffi-native:
  asset-id: package:ffigen_js_example/ffigen_js_example.dart
enums:
  as-int:
    include:
      - MyEnumAsInt
